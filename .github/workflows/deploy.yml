name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keeps every page noindex (and drops canonicals) until launch. Remove this line at launch,
      # once site.ts has a real email or Web3Forms key.
      PUBLIC_SITE_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check canonicals point at the live site
        if: env.PUBLIC_SITE_NOINDEX != 'true'
        run: grep -q 'rel="canonical" href="https://' dist/index.html
      - name: Check no localhost URLs shipped
        run: '! grep -rl "localhost:4321" dist --include=*.html --include=*.xml --include=*.txt'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
